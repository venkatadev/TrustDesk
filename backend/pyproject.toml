[project]
name = "trustdesk"
version = "0.1.0"
description = "AI agent that drafts cited answers to security questionnaires"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.44.3",
    "langgraph>=1.2.22",
    "openpyxl>=3.1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
